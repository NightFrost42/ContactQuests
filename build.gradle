plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.119'
    id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral { content { includeGroup 'org.jacoco' } }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup "thedarkcolour" }
    }
    maven { url = "https://cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.blamejared.com/"        }
    maven {
        url = 'https://maven.ftb.dev/releases'
        content { includeGroup 'dev.ftb.mods' }
    }
    maven {
        url = 'https://maven.architectury.dev'
        content { includeGroup 'dev.architectury' }
    }

    maven {
        url "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }

    maven {
        url 'https://jitpack.io'
        content {
            includeGroup "com.github.rtyley"
        }
    }
}

base {
    archivesName = mod_id
}

sourceSets {
    testmod
}

configurations {
    testmodImplementation.extendsFrom implementation
    testmodRuntimeOnly.extendsFrom runtimeOnly
}

sourceSets.testmod.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.testmod.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
kotlin.jvmToolchain(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            if (project.hasProperty('contactquestsQuickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('contactquestsQuickPlay')
            }

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.findProperty('contactquestsTestNamespaces') ?: project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            if (project.hasProperty('contactquestsTestGameDir')) {
                gameDirectory = project.file(project.property('contactquestsTestGameDir'))
            }

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${mod_id}_test" {
            sourceSet(sourceSets.testmod)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "thedarkcolour:kotlinforforge-neoforge:${kotlinforforge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    implementation("dev.ftb.mods:ftb-quests-neoforge:${ftbquests_version}") { transitive = false }
    implementation("dev.ftb.mods:ftb-library-neoforge:${ftblibrary_version}") { transitive = false }
    implementation("dev.ftb.mods:ftb-teams-neoforge:${ftbteams_version}") { transitive = false }
    implementation "curse.maven:contact-love-rekindled-1326820:${contact_love_rekindled_neoforge_21}"
    implementation "curse.maven:jade-324717:${jade_neoforge_21}"
    implementation("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") {
        exclude group: 'dev.latvian.apps', module: 'tiny-java-server'
        exclude group: 'com.github.rtyley', module: 'animated-gif-lib-for-java'
        exclude group: 'dev.latvian.mods', module: 'better-advanced-tooltips'
    }
    // Optional client recipe bridge; never bundled or required by the production mod.
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") { transitive = false }
    implementation("dev.architectury:architectury-neoforge:${architectury_version}") { transitive = false }
//    runtimeOnly "curse.maven:jupiter-1072905:${jupiter_neoforge_21}"
    implementation "curse.maven:oelib-1319210:${oelib_neoforge_21}"
    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    replaceProperties.ftbquests_version_range = ftbquests_version_range
    replaceProperties.ftblibrary_version_range = ftblibrary_version_range
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url uri("${project.projectDir}/repo")
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

compileJava {
    options.compilerArgs += [
            "-AoutRefMapFile=${project.file('src/generated/resources/contactquests.refmap.json').absolutePath}"
    ]
}

tasks.named('processResources') {
    dependsOn 'compileJava'
}

tasks.named('runServer') {
    standardInput = System.in
}

// Export the resolved launch settings once. The runner starts fresh test JVMs
// directly, so contactquestsAutoTest never starts a nested Gradle build.
configurations {
    contactquestsWindowsNatives
    contactquestsCoverageAgent { transitive = false }
    contactquestsCoverageCli { transitive = false }
}
dependencies {
    contactquestsCoverageAgent 'org.jacoco:org.jacoco.agent:0.8.16:runtime@jar'
    contactquestsCoverageCli 'org.jacoco:org.jacoco.cli:0.8.16:nodeps@jar'
    ['lwjgl', 'lwjgl-freetype', 'lwjgl-glfw', 'lwjgl-jemalloc', 'lwjgl-openal',
     'lwjgl-opengl', 'lwjgl-stb', 'lwjgl-tinyfd'].each { module ->
        contactquestsWindowsNatives "org.lwjgl:${module}:3.3.3:natives-windows"
    }
}

def exportTestLaunch = { String name, String runName, String prepareName, boolean windows ->
    tasks.register(name) {
        group = 'verification'
        dependsOn prepareName, 'testmodClasses', 'jar', 'contactquestsWindowsLaunchAgent'
        def destination = layout.buildDirectory.file("contactquests-tests/${runName}.json")
        outputs.file destination
        // Resolve and export on every explicit invocation to avoid stale settings.
        outputs.upToDateWhen { false }
        doLast {
            def run = tasks.named(runName).get()
            def cp = (run.classpath.files + run.classpathProvider.files).collect { it.absolutePath }.unique()
            def vmArgs = (run.jvmArgs + run.allJvmArgs + run.jvmArgumentProviders.collectMany { it.asArguments().toList() }).unique()
            def args = (run.args ?: []) + run.argumentProviders.collectMany { it.asArguments().toList() }
            def record = [
                java: run.javaLauncher.get().executablePath.asFile.absolutePath,
                mainClass: run.mainClass.get(), classpath: cp, jvmArgs: vmArgs,
                args: args, environment: run.environmentProperty.get(),
                gameDirectory: run.gameDirectory.get().asFile.absolutePath,
                projectDirectory: projectDir.absolutePath,
                pathSeparator: File.pathSeparator,
                productionJar: tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                coverageAgent: configurations.contactquestsCoverageAgent.singleFile.absolutePath,
                coverageCli: configurations.contactquestsCoverageCli.singleFile.absolutePath,
                windowsLaunchAgent: tasks.named('contactquestsWindowsLaunchAgent').get().archiveFile.get().asFile.absolutePath,
                windowsNatives: windows ? configurations.contactquestsWindowsNatives.files.collect { it.absolutePath } : [],
                dependencies: [neoforge: neo_version, ftbquests: ftbquests_version,
                    ftblibrary: ftblibrary_version, ftbteams: ftbteams_version,
                    kotlinforforge: kotlinforforge_version, kubejs: kubejs_version]
            ]
            def target = destination.get().asFile
            target.parentFile.mkdirs()
            target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(record)) + '\n'
        }
    }
}
tasks.register('contactquestsWindowsLaunchAgent', Jar) {
    group = 'verification'
    dependsOn 'testmodClasses'
    archiveFileName = 'contactquests-windows-launch-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('contactquests-tests')
    from sourceSets.testmod.output
    include 'com/creeperyang/contactquests/test/WindowsLwjglAccessAgent*.class'
    manifest {
        attributes 'Premain-Class': 'com.creeperyang.contactquests.test.WindowsLwjglAccessAgent'
    }
}
exportTestLaunch('contactquestsExportServerLaunch', 'runGameTestServer', 'prepareGameTestServerRun', false)
exportTestLaunch('contactquestsExportClientLaunch', 'runClient', 'prepareClientRun', true)
exportTestLaunch('contactquestsExportDedicatedLaunch', 'runServer', 'prepareServerRun', false)

def contactquestsPython = providers.environmentVariable('CQ_PYTHON').orElse(
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3')

tasks.register('contactquestsTestReport', Exec) {
    group = 'verification'
    description = 'Regenerate the report for the latest isolated ContactQuests test run.'
    workingDir projectDir
    commandLine contactquestsPython.get(), file('tests/report/generate-report.py').absolutePath, '--latest'
}

tasks.register('contactquestsAutoTest', Exec) {
    group = 'verification'
    description = 'Run all regression cases, editors, Windows multiplayer/rejoin, and an independent server/client without KubeJS or Rhino.'
    dependsOn 'contactquestsExportServerLaunch', 'contactquestsExportClientLaunch', 'contactquestsExportDedicatedLaunch'
    workingDir projectDir
    commandLine contactquestsPython.get(), file('tests/runner/run-tests.py').absolutePath,
            'suite', '--prepared'
}

tasks.register('contactquestsReleaseValidation', Exec) {
    group = 'verification'
    description = 'Check release tag/metadata/production-jar validation with isolated positive and negative fixtures.'
    workingDir projectDir
    commandLine contactquestsPython.get(), file('tests/release/test-release.py').absolutePath
}

// This run is intentionally manual-only. It is not referenced by
// contactquestsAutoTest, check, or any automatic GameTest task.
neoForge.runs {
    contactquestsClickTest {
        client()
        systemProperty 'contactquests.test.manualClick', 'true'
        systemProperty 'contactquests.test.manualClickResult', 'test-results/1.21.1-neoforge/manual-click-result.json'
        systemProperty 'neoforge.enabledGameTestNamespaces', ''
        if (project.hasProperty('contactquestsClickGameDir')) {
            gameDirectory = project.file(project.property('contactquestsClickGameDir'))
        }
        if (project.hasProperty('contactquestsClickWorld')) {
            programArguments.addAll '--quickPlaySingleplayer', project.property('contactquestsClickWorld')
        }
    }
}
